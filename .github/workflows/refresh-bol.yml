name: Ververs bol-prijzen
on:
  workflow_dispatch:
  # schedule wordt pas aangezet nadat de handmatige run met --probe klopt
  # schedule:
  #   - cron: '0 5 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Ververs prijzen
        working-directory: web
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: node scripts/refresh-bol.mjs
      - name: Commit en push (Coolify deployt automatisch)
        run: |
          git config user.name "prijsrobot"
          git config user.email "noreply@buildthatset.com"
          git add web/src/data/bol-deals.json
          git diff --cached --quiet || git commit -m "Ververs bol-prijzen via API" && git push
