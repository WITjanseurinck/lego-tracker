# Voor Coolify: voeg dit toe als Docker Compose resource.
services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VERTICAL: ${VERTICAL:-lego}
      SITE_URL: ${SITE_URL}
      DEMO: ${DEMO:-}
      GTM_ID: ${GTM_ID:-}
      BOL_SITE_ID: ${BOL_SITE_ID:-}
      RAKUTEN_ID: ${RAKUTEN_ID:-}
      LEGO_MID: ${LEGO_MID:-50641}
