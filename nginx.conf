# www.buildthatset.com stond los geïndexeerd naast de apex (dubbele content). Canoniek is de apex zonder www.
map $host $apex {
  ~^www\.(?<rest>.+)$ $rest;
  default "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  if ($apex != "") {
    return 308 https://$apex$request_uri;
  }

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml application/xml application/json text/plain;

  # Oude nieuws-URL's verhuisden naar de gidsen. Oude feedpaden naar feed.xml.
  rewrite ^/nieuws(/.*)?$ /gids permanent;
  rewrite ^/(fr/|en/)?feed/?$ /$1feed.xml permanent;

  # Gebouwde bestanden met hash in de naam mogen lang in de cache.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Deelbeelden veranderen enkel bij een nieuwe build.
  location /og/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Prijzen veranderen bij elke ronde, dus kort in de cache.
  location / {
    add_header Cache-Control "public, max-age=300";
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
  location ^~ /fr/ { error_page 404 /fr/404.html; try_files $uri $uri.html $uri/index.html =404; }
  location ^~ /en/ { error_page 404 /en/404.html; try_files $uri $uri.html $uri/index.html =404; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
